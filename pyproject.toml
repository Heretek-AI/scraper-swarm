[project]
name = "scraper-swarm-workspace"
version = "0.0.0"
description = "Workspace root for Scraper Swarm"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/panel-api", "apps/swarmd", "apps/gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "E501", "S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
