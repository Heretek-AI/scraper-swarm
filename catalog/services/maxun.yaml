id: maxun
name: Maxun
tier: optional
verified: false
license:
  spdx: AGPL-3.0-only
  notice: "Maxun is licensed under AGPL-3.0. Accessible only via authenticated panel forward proxy."
image: { repo: getmaxun/maxun-backend, tag: latest }
resources:
  lite:     { cpus: 1, mem: 2g, shm: 1g }
  standard: { cpus: 2, mem: 4g, shm: 2g }
  heavy:    { cpus: 4, mem: 8g, shm: 4g }
networks: [svc, egress-web]
port: 8080
hardening: { user: "1000:1000", seccomp: chromium }
secrets: [JWT_SECRET, ENCRYPTION_KEY, DB_PASSWORD]
native_exposable: false
params_schema:
  type: object
  additionalProperties: false
  properties:
    headless: { type: boolean }
    max_concurrent_sessions: { type: integer, minimum: 1, maximum: 10 }
    backend_port: { type: integer, minimum: 1024, maximum: 65535 }
param_env:
  headless: HEADLESS
  max_concurrent_sessions: MAX_CONCURRENT_SESSIONS
  backend_port: BACKEND_PORT
