id: crawl4ai
name: Crawl4AI
tier: core
verified: false
license: { spdx: Apache-2.0 }
image: { repo: unclecode/crawl4ai, tag: latest }
resources:
  lite:     { cpus: 1, mem: 2g, shm: 1g }
  standard: { cpus: 2, mem: 4g, shm: 2g }
  heavy:    { cpus: 4, mem: 8g, shm: 4g }
networks: [svc, egress-web]
port: 11235
hardening: { user: "999:999", seccomp: chromium }
# P1-live-smoke NO_PROXY fix follow-up (walkthrough.md::smoke-3-3): loopback
# no longer bypasses Smokescreen, so the image's built-in
# `curl -f http://localhost:11235/health` probe would be proxied and denied
# with 407. This override keeps the same probe but pins curl to
# `--noproxy '*'` so only the healthcheck -- never crawler traffic -- skips
# the egress proxy.
health:
  test: ["CMD-SHELL", "redis-cli ping > /dev/null && curl --noproxy '*' -f http://localhost:11235/health || exit 1"]
  interval: 30s
secrets: [CRAWL4AI_API_TOKEN, OPENAI_API_KEY, ANTHROPIC_API_KEY, GROQ_API_KEY]
env:
  CRAWL4AI_ALLOW_INTERNAL_URLS: "true"
native_exposable: true
params_schema:
  type: object
  additionalProperties: false
  properties:
    llm_provider: { type: string, pattern: "^[a-z0-9_.:/-]{1,80}$" }
    llm_base_url: { type: string }
    llm_temperature: { type: number, minimum: 0.0, maximum: 2.0 }
    headless: { type: boolean }
    page_timeout: { type: integer, minimum: 5, maximum: 300 }
param_env:
  llm_provider: LLM_PROVIDER
  llm_base_url: LLM_BASE_URL
  llm_temperature: LLM_TEMPERATURE
  headless: CRAWL4AI_HEADLESS
  page_timeout: CRAWL4AI_TIMEOUT
