id: gpt-researcher
name: GPT Researcher
tier: core
verified: false
license:
  spdx: Apache-2.0
image: { repo: gptresearcher/gpt-researcher, tag: latest }
resources:
  lite:     { cpus: 1, mem: 1g }
  standard: { cpus: 2, mem: 2g }
  heavy:    { cpus: 4, mem: 4g }
networks: [svc, egress-web]
requires: [searxng]
port: 8000
hardening: { user: "1000:1000", tmpfs: ["/tmp"] }
secrets: [OPENAI_API_KEY, ANTHROPIC_API_KEY, TAVILY_API_KEY]
env:
  RETRIEVER: "searx"
  SEARX_URL: "http://searxng:8080"
# Ticket #6: the retriever calls searxng over plain HTTP, so that one peer
# stays direct; everything else traverses the egress proxy.
direct_peers: [searxng]
native_exposable: true
params_schema:
  type: object
  additionalProperties: false
  properties:
    retriever: { type: string, enum: ["searx", "duckduckgo", "tavily", "google"] }
    smart_llm: { type: string }
    fast_llm: { type: string }
    embedding_provider: { type: string }
    total_words: { type: integer, minimum: 500, maximum: 10000 }
    report_format: { type: string, enum: ["APA", "MLA", "IEEE", "standard"] }
param_env:
  retriever: RETRIEVER
  smart_llm: SMART_LLM
  fast_llm: FAST_LLM
  embedding_provider: EMBEDDING_PROVIDER
  total_words: TOTAL_WORDS
  report_format: REPORT_FORMAT
