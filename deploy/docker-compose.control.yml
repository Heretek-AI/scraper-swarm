# Scraper Swarm — Production Control Plane Compose
# Deploys Caddy Edge Proxy, Panel API, Swarmd Privileged Sidecar, Gateway, and Egress SSRF Guard
#
# Operator environment lives in the repo-root .env (copy from .env.example).
# Launch with: docker compose --env-file ../.env -f deploy/docker-compose.control.yml up -d
# (env_file entries below also load ../.env into panel-api/gateway containers.)

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - ../apps/panel-web/dist:/var/www/panel-web:ro,z
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      - panel-api
      - gateway

  panel-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.panel-api
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      - SWARM_DATA_DIR=/var/lib/scraper-swarm
      - SWARM_REPO_ROOT=/opt/scraper-swarm
      - SWARM_BOOTSTRAP_TOKEN
      # Ticket #7: public MCP origin for key-issuance snippets, and the
      # external domain (Caddy uses SWARM_DOMAIN). See .env.example.
      - SWARM_PUBLIC_MCP_URL=${SWARM_PUBLIC_MCP_URL:-}
      - SWARM_DOMAIN=${SWARM_DOMAIN:-localhost}
      # Gateway contract env (see .env.example): SSRF resolver posture,
      # audit query privacy / HMAC salt / retention.
      - SWARM_SSRF_RESOLVER_FAIL_CLOSED=${SWARM_SSRF_RESOLVER_FAIL_CLOSED:-}
      - SWARM_AUDIT_QUERY_MODE=${SWARM_AUDIT_QUERY_MODE:-verbatim}
      - SWARM_AUDIT_HMAC_SALT
      - SWARM_AUDIT_RETENTION_DAYS=${SWARM_AUDIT_RETENTION_DAYS:-}
    volumes:
      - swarm_data:/var/lib/scraper-swarm
      - ../catalog:/opt/scraper-swarm/catalog:ro,z
    networks:
      - edge
      - control
      - svc

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      - SWARM_DB_PATH=/var/lib/scraper-swarm/panel.db
      - SEARXNG_URL=http://searxng:8080
      - CRAWL4AI_URL=http://crawl4ai:11235
      # Gateway contract env (see .env.example + docs/opencode-integration.md):
      # fetch cap, SSRF resolver posture, audit privacy/retention, deployed
      # engine set, and public domain/origin for snippets/links.
      - SWARM_MAX_FETCH_BYTES=${SWARM_MAX_FETCH_BYTES:-3145728}
      - SWARM_SSRF_RESOLVER_FAIL_CLOSED=${SWARM_SSRF_RESOLVER_FAIL_CLOSED:-}
      - SWARM_AUDIT_QUERY_MODE=${SWARM_AUDIT_QUERY_MODE:-verbatim}
      - SWARM_AUDIT_HMAC_SALT
      - SWARM_AUDIT_RETENTION_DAYS=${SWARM_AUDIT_RETENTION_DAYS:-}
      - SWARM_DEPLOYED_ENGINES=${SWARM_DEPLOYED_ENGINES:-}
      - SWARM_DOMAIN=${SWARM_DOMAIN:-localhost}
      - SWARM_PUBLIC_MCP_URL=${SWARM_PUBLIC_MCP_URL:-}
    volumes:
      # P1-live-smoke audit fix: read-write so live /mcp calls persist agent:*
      # audit rows (hash-chained, sanitized, no secrets). Was :ro which made
      # log_agent_activity fail silently with agent rows stuck at 0.
      - swarm_data:/var/lib/scraper-swarm
    networks:
      - edge
      - svc

  swarmd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.swarmd
    restart: unless-stopped
    security_opt:
      - label:disable
    environment:
      # Phase 02-infra-reconcile: background drift-repair loop. Set to 0 to
      # disable (operator re-deploy / POST /services/reconcile still work).
      - SWARM_RECONCILE_INTERVAL_S=60
      - SWARM_RECONCILE_BOOT_DELAY_S=15
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - swarm_data:/var/lib/scraper-swarm
      - ../catalog:/opt/scraper-swarm/catalog:ro,z
    networks:
      - control

  egress-web:
    image: scraper-swarm/egress-web:local
    restart: unless-stopped
    networks:
      - svc
      - egress-out

networks:
  edge:
    name: swarm-edge
  control:
    name: swarm-control
    internal: true
  svc:
    name: swarm-svc
    internal: true
  egress-out:
    name: swarm-egress-out

volumes:
  swarm_data:
    name: scraper_swarm_data
  caddy_data:
    name: scraper_caddy_data
  caddy_config:
    name: scraper_caddy_config
