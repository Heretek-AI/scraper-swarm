name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-test:
    name: Python Suite & Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run Python unit & integration tests
        run: uv run pytest apps/ -v --tb=short

      - name: Lint (ruff)
        run: uv run ruff check apps/ tests/

      - name: Type check (mypy)
        run: uv run mypy apps/gateway/src apps/panel-api/src apps/swarmd/src --ignore-missing-imports

  frontend-and-plugin-test:
    name: Frontend Build & Plugin Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run plugin tests
        run: pnpm -r test

      - name: Build web console
        run: pnpm --filter panel-web build

      - name: Audit production dependencies
        run: pnpm audit --prod
