[project]
name = "swarmd"
version = "0.0.1"
description = "Privileged sidecar: renders hardened compose files from the trusted catalog"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pyyaml>=6", "jsonschema>=4.22"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
